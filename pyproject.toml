[project]
name = "moodle-scanner"
version = "3.0.0"
description = "Non-destructive external Moodle version, advisory and misconfiguration scanner"
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [{ name = "LuemmelSec" }, { name = "szybnev" }]
requires-python = ">=3.10"
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
dependencies = [
    "truststore==0.10.5",
]

[project.urls]
Repository = "https://github.com/szybnev/Moodle-Scanner"

[project.scripts]
moodle-scanner = "moodle_scanner.cli:main"

[build-system]
requires = ["uv_build>=0.9,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[dependency-groups]
dev = [
    "jsonschema==4.26.0",
    "pytest==9.1.1",
    "ruff==0.14.0",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]  # long literal strings; ruff format enforces code width
