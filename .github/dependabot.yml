version: 2
updates:
  # Python dependencies pinned in pyproject.toml / uv.lock.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      dev-tools:
        dependency-type: "development"
  # Lab images are pinned by tag in lab/instances.json and pulled at run time;
  # they are not tracked here because the compose file is generated.
